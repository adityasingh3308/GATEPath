
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | GATEPath</title>
    <link rel="stylesheet" th:href="@{/css/password-reset.css}">
</head>
<body>

<div class="reset-page">
    <div class="reset-card">

        <a th:href="@{/login}" class="brand">
            <span class="brand-icon">G</span>
            <span>GATE<span class="brand-highlight">Path</span></span>
        </a>

        <div class="icon-circle">
            <span>✉</span>
        </div>

        <p class="eyebrow">ACCOUNT RECOVERY</p>
        <h1>Forgot your password?</h1>
        <p class="subtitle">
            No worries! Enter your registered email address and
            we'll send you a password reset link.
        </p>

        <div th:if="${message}" class="alert success" th:text="${message}"></div>
        <div th:if="${error}" class="alert error" th:text="${error}"></div>

        <form th:action="@{/forgot-password}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">

            <label for="email">Email address</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="you@example.com"
                autocomplete="email"
                required
            >

            <button type="submit" class="primary-button">
                Send Reset Link <span>→</span>
            </button>
        </form>

        <a th:href="@{/login}" class="back-link">
            <span>←</span> Back to login
        </a>

        <div class="security-note">
            <span>🔒</span>
            Your account security is our priority.
        </div>

    </div>

    <p class="footer-text">© 2026 GATEPath. Your journey to GATE success.</p>
</div>

</body>
</html>

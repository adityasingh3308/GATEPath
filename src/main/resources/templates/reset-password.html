
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | GATEPath</title>
    <link rel="stylesheet" th:href="@{/css/password-reset.css}">
</head>
<body>

<div class="reset-page">
    <div class="reset-card">

        <a th:href="@{/login}" class="brand">
            <span class="brand-icon">G</span>
            <span>GATE<span class="brand-highlight">Path</span></span>
        </a>

        <div class="icon-circle">
            <span>🔑</span>
        </div>

        <p class="eyebrow">ACCOUNT SECURITY</p>
        <h1>Create new password</h1>
        <p class="subtitle">
            Choose a strong password to secure your GATEPath account.
        </p>

        <div th:if="${message}" class="alert success" th:text="${message}"></div>
        <div th:if="${error}" class="alert error" th:text="${error}"></div>

        <form th:action="@{/reset-password}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}">
            <input type="hidden" name="token" th:value="${token}">

            <label for="password">New password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter new password"
                minlength="8"
                maxlength="72"
                autocomplete="new-password"
                required
            >

            <label for="confirmPassword">Confirm new password</label>
            <input
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                placeholder="Re-enter new password"
                minlength="8"
                maxlength="72"
                autocomplete="new-password"
                required
            >

            <p class="password-hint">
                Use at least 8 characters for your password.
            </p>

            <button type="submit" class="primary-button">
                Reset Password <span>→</span>
            </button>
        </form>

        <a th:href="@{/login}" class="back-link">
            <span>←</span> Back to login
        </a>

        <div class="security-note">
            <span>🔒</span>
            Never share your password with anyone.
        </div>

    </div>

    <p class="footer-text">© 2026 GATEPath. Your journey to GATE success.</p>
</div>

</body>
</html>

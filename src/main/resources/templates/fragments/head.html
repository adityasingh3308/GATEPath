
<head th:fragment="head(title, pageCss)"
      xmlns:th="http://www.thymeleaf.org">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${title}">GATEPath</title>

    <!-- Common Favicon -->
    <link rel="icon"
          type="image/png"
          th:href="@{/images/favicon.png(v=12)}">

    <!-- Common Description -->
    <meta name="description"
          content="GATEPath - GATE exam information, syllabus and preparation resources.">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">

          
<!-- Bootstrap Icons -->
<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Common CSS -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    

<!-- Common header CSS: load on every page -->
<link rel="stylesheet" th:href="@{/css/header.css}">

<!-- Sidebar CSS: only for pages using the sidebar -->
<th:block th:if="${dashboardLayout != null and dashboardLayout}">
    <link rel="stylesheet" th:href="@{/css/sidebar.css}">
</th:block>

    <!-- Page-specific CSS -->
    <th:block th:if="${pageCss != null and !#strings.isEmpty(pageCss)}">
        <link rel="stylesheet"
              th:href="@{|/css/${pageCss}|}">
    </th:block>
    <link rel="stylesheet" th:href="@{/css/footer.css}">

</head>
